---
- name: Install required s/w's on devserver
  hosts: devserver
  tasks:
    - name: Install necessary s/w's
      apt:
        name: "{{item.a}}"
        state: "{{item.b}}"
        update_cache: "{{item.c}}"
      loop:
        - {a: openjdk-21-jdk,b: present,c: yes}
        - {a: git,b: present,c: no}
        - {a: maven,b: present,c: no}
- name: Install required s/w's on qaserver
  hosts: qaserver
  tasks:
    - name: Install necessary s/w's
      apt:
        name: "{{item.a}}"
        state: "{{item.b}}"
        update_cache: "{{item.c}}"
      loop:
        - {a: openjdk-21-jdk,b: present,c: yes}
        - {a: git,b: present,c: no}
        - {a: tomcat10,b: present,c: no}
        - {a: tomcat10-admin,b: present,c: no}
- name: Install required s/w's on prodserver
  hosts: prodserver
  tasks:
    - name: Install necessary s/w's
      apt:
        name: "{{item.a}}"
        state: "{{item.b}}"
        update_cache: "{{item.c}}"
      loop:
        - {a: tomcat10,b: present,c: no}
        - {a: tomcat10-admin,b: present,c: no}
- name: Continuous Download and Continuous Build
  hosts: devserver
  tasks:
    - name: Download development code from github
      git:
        repo: https://github.com/IntelliqDevops/maven.git
        dest: dev-git
    - name: Create an artifact from the downloaded code
      shell: cd dev-git;mvn package
    - name: Fetch the artifact into the controller from devserver
      fetch:
        src: dev-git/webapp/target/webapp.war
        dest: /tmp 
- name: Continuous Deployment and Continuous Testing
  hosts: qaserver
  tasks:
    - name: Deploy artifact into tomcat on qaserver
      copy:
        src: /tmp/172.31.30.64/dev-git/webapp/target/webapp.war
        dest: /var/lib/tomcat10/webapps/testapp.war
    - name: Download the selenium script from github
      git: 
        repo: https://github.com/IntelliqDevops/FunctionalTesting.git
        dest: test-git
    - name: Run the selenium scripts
      shell: java -jar test-git/testing.jar
- name: Continuous Delivery
  hosts: prodserver
  tasks:
    - name: Deploy artifact into tomcat on prodserver
      copy: 
        src: /tmp/172.31.30.64/dev-git/webapp/target/webapp.war
        dest: /var/lib/tomcat10/webapps/prodapp.war
...




