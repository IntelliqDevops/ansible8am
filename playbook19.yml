---
- name: Implementing tags
  hosts: all
  tasks:
    - name: Install tomcat10
      apt:
        name: tomcat10
        state: present
        update_cache: yes
      tags: 
       - install
       - tomcat_install
       - never
    - name: Install apache2
      apt:
        name: apache2
        state: present
        update_cache: yes
      tags:
        - install
        - apache_install
    - name: Restart tomcat10
      service:
        name: tomcat10
        state: restarted
      tags:
        - restart
        - tomcat_restart
    - name: Restart apache2
      service:
        name: apache2
        state: restarted
      tags:
        - restart
        - apache_restart
...




