---
- name: Check if the file is executable of so delete it
  hosts: all
  tasks:
    - name: Capture file info
      stat:
        path: /tmp/file1
      register: a
    - name: Display output of the above module
      debug:
        var: a
    - name: Delete if the file is execuable
      file:
        name: /tmp/file1
        state: absent
      when: a.stat.executable == true
...
